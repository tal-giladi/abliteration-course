  question: Two engineers both implement `random_search` correctly per the course spec, with the same `seed` and `param_space`, but their `best_score` results differ. Is one of them wrong?
  options:
    - Yes; the same seed must produce identical draws, so the one that differs from the Lesson 14 reference run has a bug
    - No; the spec does not fix RNG call order, so both can be correct, which is why the Lesson 14 checker grades behavior
    - Yes; one of them is probably reseeding inside the loop, which the spec forbids and the checker detects by comparing numbers
    - No; random search is nondeterministic even with a seed, so the checker reruns each submission several times and averages
