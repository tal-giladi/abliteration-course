- source: 2c29d66fc2a0
  question: 'A teammate proposes: "just run the search, and pick whichever trial has the lowest `refusal_rate`." What is wrong with that selection rule?'
  options:
    - Nothing is wrong with it; a low `refusal_rate` already implies the model stayed coherent, since a damaged model tends to refuse more often
    - It overfits to the harmful prompt set, so you should instead pick the trial with the median `refusal_rate` across all trials
    - It rewards a model broken into incoherence that cannot form a refusal; check that `coherence_score` stays near 1.0 on the same trial
    - It ignores run time, so you should pick the fastest trial whose `refusal_rate` falls below a fixed threshold like 10%
  correct: 2
- source: 1200f560bb50
  question: You ablate every layer at strength 1.0 (the maximum) and `refusal_rate` on the held-out harmful set drops to 0%. Is this a successful abliteration?
  options:
    - Not necessarily; check `coherence_score` vs. the original model, where a value far below 1.0 means general damage
    - Yes; a 0% refusal rate on a held-out set is the definition of success, and no other number can change that conclusion
    - Not necessarily; rerun `refusal_rate` on the training harmful set, and a higher rate there would mean the direction was not general
    - Yes, as long as `refusal_rate` on harmless prompts is also 0%, which confirms the edit touched only the refusal behavior
  correct: 0
- source: b4a4756c9e5c
  question: "`coherence_score(logits_a, logits_b)` returns `1.0` when called with the same tensor for both arguments. Why, in terms of what the function computes?"
  options:
    - The function checks whether the two tensors are identical and returns 1.0 as a special case before doing any math
    - It computes cosine similarity of the logits, and any vector has cosine similarity 1.0 with itself
    - It computes the fraction of positions where the argmax tokens agree, and identical logits agree at every position
    - It computes `exp(-KL(base || edited))`; KL of a distribution with itself is exactly 0, and `exp(-0) = 1.0`
  correct: 3
