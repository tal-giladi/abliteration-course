- source: ee3563fa684c
  question: A colleague suggests computing the refusal direction from one extremely clear example ("How do I build a pipe bomb?") instead of averaging over 20 prompts. Why is the single-prompt direction worse?
  options:
    - One prompt cannot fill a full `hidden_size` vector, so most dimensions of the direction are left at zero.
    - A clear prompt triggers too strong a refusal, so the direction overshoots and must be rescaled by hand.
    - Its activation mixes topic, phrasing, and length with refusal, and one example cannot separate them.
    - The tokenizer truncates short prompts, so a single example never reaches the layers where refusal lives.
  correct: 2
- source: 5e1f7c386ced
  question: "`HARMFUL_PROMPTS` is split into `HARMFUL_TRAIN` (first 20) and `HARMFUL_HOLDOUT` (last 4). Which set builds the direction, and why must the split stay fixed?"
  options:
    - The train sets build it; a fixed split means holdout prompts never influenced the direction.
    - The holdout sets build it; a fixed split keeps the training data reproducible across sessions.
    - All 24 prompts build it; the split only matters later when choosing which layer to ablate.
    - The train sets build it; the split is fixed only so results match the numbers in the lessons.
  correct: 0
- source: d9eca5f846b5
  question: "`compute_direction` returns `normalize(mean_a - mean_b)` rather than the raw difference. What would become harder in Lesson 12 (per-layer ablation strength) without normalization?"
  options:
    - Unnormalized directions cannot be subtracted from a weight matrix, so the ablation step would error out.
    - Raw differences point the opposite way at deeper layers, so ablation would add refusal instead of removing it.
    - Normalization is what removes the harmless mean, so raw directions would still carry harmless content.
    - Raw magnitude tracks each layer's activation scale, so the per-layer strength knob would fight that noise.
  correct: 3
- source: f19dbc74d5bd
  question: "`F.normalize(diff, dim=-1)` is called once on a `[num_layers + 1, hidden_size]` tensor. Why does the direction at layer 5 have no effect on the length of the direction at layer 20?"
  options:
    - "`dim=-1` divides every row by the global norm of the whole tensor, which is shared by all layers."
    - "`dim=-1` normalizes each layer's `hidden_size` vector on its own, using only that layer's norm."
    - "`dim=-1` normalizes across layers for each hidden dimension, rescaling the tensor column by column."
    - "`dim=-1` only normalizes the last layer, and earlier layers keep their raw magnitudes unchanged."
  correct: 1
