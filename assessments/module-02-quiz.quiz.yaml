  question: Held-out projection scores show almost no separation at layer 2 but a clean gap at layer 14. Does this mean the direction is wrong at layer 2?
  options:
    - No; it is computed correctly, but layer 2 is near the embeddings, where the concept is still weak.
    - Yes; layer 2 has a bug in its mean, since a correct direction separates equally well at every layer.
    - Yes; early layers need more training prompts, so layer 2's direction is undersampled and unusable.
    - No; layer 2 separates just as well, but its scores are on a smaller scale and need rescaling first.
