- source: ddfb6b451225
  question: You test `projection_scores` only on `HARMFUL_TRAIN` and `HARMLESS_TRAIN` (the prompts used to build the direction) and see a huge margin. Does that prove the direction generalizes?
  options:
    - Yes; a large margin on any prompts shows the direction captures refusal, whichever set they come from.
    - Yes, as long as the margin holds at every layer, since overfitting would only appear at a few layers.
    - No; it was built to separate those prompts, so only a margin on unseen holdout prompts shows that.
    - No; training prompts always score near zero after normalization, so any margin there is just noise.
