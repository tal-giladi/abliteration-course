- source: 556b8c183250
  question: A residual at layer 14 is `v` and `direction[14]` is a unit vector `d`. What does `v @ d` measure, and why does `projection_scores` re-normalize `d` anyway?
  options:
    - The angle between `v` and `d` in radians; re-normalizing converts the result from degrees to radians.
    - The total length of `v`; re-normalizing `d` stops that length from being counted twice in the score.
    - The cosine similarity of `v` and `d`; re-normalizing is required because `v` is never unit length.
    - How much of `v` points along `d`; re-normalizing keeps it correct even if given an unnormalized `d`.
