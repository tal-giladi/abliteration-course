- source: 743e685bdb4e
  question: You wrote a new scorer plugin and want to verify it before a real multi-trial run on a full-size model. What is the fastest real check, and why does it need no model?
  options:
    - Call its `validate_contract()` classmethod; heretic runs the same check at startup before any model loads
    - Run `heretic --n-trials 1` with a tiny model; one trial exercises the scorer end to end, and small models load in seconds
    - Instantiate the scorer with mock logits and call `get_score`; the scorer only ever sees tensors, never the model itself
    - Run the plugin's own unit tests with `pytest`; heretic requires every plugin to ship tests that stub out model loading
  correct: 0
