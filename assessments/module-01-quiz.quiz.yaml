- source: 17959d516c95
  question: A colleague says "layer 5 transforms the output of layer 4 into something new." Which statement best corrects them, in terms of the residual connection?
  options:
    - Layer 5 overwrites the stream with its own output, and the residual connection only stores a copy for backprop.
    - Layer 5 adds its contribution to layer 4's output, so the stream accumulates rather than being replaced.
    - Layer 5 averages its output with layer 4's output, so each layer contributes exactly half of the new stream.
    - Layer 5 multiplies layer 4's output by a learned gate, so the residual connection scales the stream each layer.
  correct: 1
- source: 9d6aeb5a51b2
  question: "`output_hidden_states=True` on a model with 28 decoder layers returns a tuple of how many tensors, and what do entries `0` and `28` represent?"
  options:
    - 28 tensors; entry `0` is the output of the first decoder layer and entry `28` does not exist.
    - 28 tensors; entry `0` is the embedding output and entry `28` wraps around to the final logits.
    - 30 tensors; entry `0` is the tokenized input ids and entry `28` is the stream before the final norm.
    - 29 tensors; entry `0` is the embedding output and entry `28` is the stream after all 28 layers.
