- source: bb4e1f547e1e
  question: A colleague says "ablation zeroes out the neuron that represents refusal." Which statement best corrects them?
  options:
    - Ablation zeroes a small cluster of neurons rather than one, since refusal is spread over a few coordinates.
    - Ablation removes a direction spanning many residual dimensions at once, not a value in a single neuron.
    - Ablation zeroes the refusal neuron's incoming weights rather than its activation, which is safer to edit.
    - Ablation retrains the neuron to output zero on harmful prompts, leaving its behavior elsewhere unchanged.
  correct: 1
- source: 13a138b818f1
  question: Given a unit vector `d` (`d . d = 1`) and any vector `v`, which derivation shows that `v' = v - (v . d) d` satisfies `v' . d = 0`?
  options:
    - "`v' . d = v . d - (v . d) = 0`, because `v . d` is always zero for any vector `v` and any unit `d`."
    - "`v' . d = (v - d) . d - (v . d) = v . d - 1 - v . d`, which cancels to zero since `d` is unit."
    - "`v' . d = v . v - (v . d)(v . d)`, which is zero by the Cauchy-Schwarz inequality for a unit `d`."
    - "`v' . d = v . d - (v . d)(d . d) = v . d - (v . d)(1) = 0`, by distributing and using `d . d = 1`."
  correct: 3
- source: 3688f278052f
  question: "`ablate_vector`, `ablate_matrix_output`, and `ablate_matrix_input` normalize `direction` internally. Why does that matter for the orthogonality proof `v' . d = 0`?"
  options:
    - Normalization makes the ablation faster on GPU, which the proof assumes when it bounds numeric error.
    - Normalization flips `d` to point toward the harmful mean, which the proof needs to get the sign right.
    - The proof relies on `d . d = 1`; otherwise the terms do not cancel and a component along `d` remains.
    - The proof only holds for integer vectors, and normalization rounds `d` to the nearest integer vector.
  correct: 2
