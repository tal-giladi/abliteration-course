- source: 1c9c356da78d
  question: "`embed_tokens.weight` is ablated with `ablate_matrix_input`, not `ablate_matrix_output`. What is different about its rows compared to `o_proj.weight`'s outputs?"
  options:
    - Its rows are transposed on disk, so `ablate_matrix_input` is just the same operation with swapped axes.
    - Its rows are gradients saved from training, so they must be projected on the input side to stay stable.
    - Its rows are far smaller than `o_proj` outputs, so an output-side projection would underflow to zero.
    - Each row already is the residual vector for its token, not the output of a `y = W @ x` computation.
